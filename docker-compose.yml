services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: redline-app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      TZ: Asia/Jakarta
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-redline}
      DB_USERNAME: ${DB_USERNAME:-redline}
      DB_PASSWORD: ${DB_PASSWORD:-redline_secret}
    volumes:
      - ./:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/redline.ini:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [redline]

  web:
    image: nginx:1.27-alpine
    container_name: redline-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [redline]

  db:
    image: mariadb:11
    container_name: redline-db
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
      MARIADB_DATABASE: ${DB_DATABASE:-redline}
      MARIADB_USER: ${DB_USERNAME:-redline}
      MARIADB_PASSWORD: ${DB_PASSWORD:-redline_secret}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-redline}
      MYSQL_USER: ${DB_USERNAME:-redline}
      MYSQL_PASSWORD: ${DB_PASSWORD:-redline_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    # Hanya dapat diakses dari host ini (mis. lewat SSH tunnel).
    # Sebelumnya "3307:3306" berarti 0.0.0.0 — MariaDB terbuka ke seluruh
    # jaringan lokal, padahal kredensialnya ada di repo publik.
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [redline]

  # TIDAK ikut menyala pada `docker compose up -d`.
  #
  # Jalankan setelah token diisi:  ./scripts/redline.sh tunnel
  #
  # Command bawaannya `tunnel run` (tunnel remote-managed, ingress diatur di
  # dashboard Cloudflare). Tanpa TUNNEL_TOKEN container ini berhenti dengan
  # error — disengaja. Sebelumnya bawaannya `--url http://web:80`, yang tanpa
  # token membuat "quick tunnel": backend ini terbuka ke internet di URL
  # trycloudflare.com acak TANPA autentikasi apa pun. Itu pernah terjadi tanpa
  # disengaja, jadi mode gagal yang aman lebih diutamakan daripada kemudahan.
  #
  # Service URL public hostname di dashboard: http://web:80 — nama service di
  # jaringan compose ini. Jangan IP LAN host: IP itu berubah setiap server
  # dinyalakan di jaringan lain dan tunnel langsung mati dari luar.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: redline-tunnel
    restart: unless-stopped
    profiles: [tunnel]
    command: ${CLOUDFLARE_TUNNEL_COMMAND:-tunnel --no-autoupdate run}
    environment:
      # Sengaja `:-` dan bukan `:?`: Compose menginterpolasi SELURUH berkas
      # meski profil tunnel tidak aktif, sehingga `:?` membuat `docker compose
      # up -d` biasa ikut gagal hanya karena token belum diisi. Penjagaannya
      # ada di ./scripts/redline.sh tunnel, dan cloudflared sendiri berhenti
      # dengan error bila token kosong.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      # QUIC (bawaan cloudflared) butuh UDP/7844 keluar, yang lazim diblokir
      # di WiFi kantor, kampus, dan hotel. http2 lewat TCP/443 hampir selalu
      # lolos. Setel TUNNEL_PROTOCOL=quic bila jaringannya bersahabat.
      TUNNEL_TRANSPORT_PROTOCOL: ${TUNNEL_PROTOCOL:-http2}
    depends_on: [web]
    networks: [redline]

  # GUI database hanya untuk pemeliharaan. Dijalankan eksplisit dengan:
  #   docker compose --profile tools up -d adminer
  adminer:
    image: adminer:4
    container_name: redline-adminer
    restart: unless-stopped
    profiles: [tools]
    ports:
      - "127.0.0.1:8081:8080"
    depends_on: [db]
    networks: [redline]

  # Idem adminer:
  #   docker compose --profile tools up -d phpmyadmin
  phpmyadmin:
    image: phpmyadmin:5
    container_name: redline-phpmyadmin
    restart: unless-stopped
    profiles: [tools]
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      db:
        condition: service_healthy
    networks: [redline]

  node:
    image: node:22-alpine
    container_name: redline-node
    working_dir: /var/www
    volumes:
      - ./:/var/www
    profiles: [assets]
    command: sh -c "npm install && npm run build"
    networks: [redline]

networks:
  redline:
    driver: bridge

volumes:
  dbdata:
    driver: local
