services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: redline-app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      TZ: Asia/Jakarta
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-redline}
      DB_USERNAME: ${DB_USERNAME:-redline}
      DB_PASSWORD: ${DB_PASSWORD:-redline_secret}
    volumes:
      - ./:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/redline.ini:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [redline]

  web:
    image: nginx:1.27-alpine
    container_name: redline-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [redline]

  db:
    image: mariadb:11
    container_name: redline-db
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
      MARIADB_DATABASE: ${DB_DATABASE:-redline}
      MARIADB_USER: ${DB_USERNAME:-redline}
      MARIADB_PASSWORD: ${DB_PASSWORD:-redline_secret}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-redline}
      MYSQL_USER: ${DB_USERNAME:-redline}
      MYSQL_PASSWORD: ${DB_PASSWORD:-redline_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [redline]

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: redline-tunnel
    restart: unless-stopped
    command: ${CLOUDFLARE_TUNNEL_COMMAND:-tunnel --no-autoupdate --url http://web:80}
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [web]
    networks: [redline]

  adminer:
    image: adminer:4
    container_name: redline-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on: [db]
    networks: [redline]

  phpmyadmin:
    image: phpmyadmin:5
    container_name: redline-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8082:80"
    depends_on:
      db:
        condition: service_healthy
    networks: [redline]

  node:
    image: node:22-alpine
    container_name: redline-node
    working_dir: /var/www
    volumes:
      - ./:/var/www
    profiles: [assets]
    command: sh -c "npm install && npm run build"
    networks: [redline]

networks:
  redline:
    driver: bridge

volumes:
  dbdata:
    driver: local
