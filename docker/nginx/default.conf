# Nginx vhost untuk Redline (SIRC) → PHP-FPM (service "app")
server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    client_max_body_size 10M;

    # Jangan bocorkan versi nginx di header Server / halaman error.
    server_tokens off;

    # Catatan: security header untuk response aplikasi dikirim oleh middleware
    # App\Http\Middleware\SecurityHeaders. Sengaja TIDAK di-set di level server
    # supaya tidak dobel (nginx add_header menambah, bukan menimpa header upstream).

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Jangan layani file tersembunyi / sensitif.
    # Harus di atas blok aset statis: regex location dicocokkan sesuai urutan.
    location ~ /\.(?!well-known).* { deny all; }
    location ~* \.(env|log|sql|md)$ { deny all; }

    # Aset statis dilayani nginx langsung, jadi header-nya di-set di sini.
    location ~* \.(js|css|png|jpe?g|gif|svg|ico|webp|woff2?|ttf)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}
